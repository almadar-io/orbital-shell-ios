name: Release

# A v* tag publishes this shell as a program orb runs: @almadar/orb-shell-ios
# (+ one platform package per OS/arch carrying the binary and its templates).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: almadar-io/orbital-core/.github/workflows/program-release.yml@main
    with:
      name: orb-shell-ios
      kind: shell
      shell: ios
      cargo-args: --bin orb-shell-ios
    secrets: inherit

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-pack:
    runs-on: ${{ vars.ALMADAR_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the renderer pack
        run: node scripts/check-pack.mjs

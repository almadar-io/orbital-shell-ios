name: {{APP_NAME}}
{{SIGN_IN_PACKAGES}}targets:
  {{APP_NAME}}:
    type: application
    platform: iOS
    deploymentTarget: "{{NATIVE_GPU_MIN_IOS}}"
    sources:
      - path: main.c
      - path: OrbitalVideoOverlay.m
      - path: OrbitalMotion.m
      - path: {{SIGN_IN_SOURCE}}
{{SIGN_IN_RESOURCES}}      - path: program.orb
        buildPhase: resources
      - path: language.json
        buildPhase: resources
      - path: native-host.json
        buildPhase: resources
      - path: bundle-files.json
        buildPhase: resources
      - path: lazy
        type: folder
        optional: true
        buildPhase: resources
      - path: fonts
        type: folder
        optional: true
        buildPhase: resources
{{SIGN_IN_DEPENDENCIES}}    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{APP_PACKAGE}}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_DEBUG_DYLIB: "NO"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ORB_NATIVE_FRAMEWORKS: "-framework Metal -framework QuartzCore -framework AudioToolbox -framework CoreAudio -framework AVFoundation -framework Foundation -framework CoreFoundation -framework CoreGraphics -framework CoreText -framework Security -framework SystemConfiguration -framework UIKit -framework WebKit -lobjc"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/lib/aarch64-apple-ios-sim/{{NATIVE_GPU_LIBRARY}} $(ORB_NATIVE_FRAMEWORKS)"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/lib/aarch64-apple-ios/{{NATIVE_GPU_LIBRARY}} $(ORB_NATIVE_FRAMEWORKS)"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "{{APP_TITLE}}"
        UILaunchScreen: {}
{{SIGN_IN_URL_TYPES}}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

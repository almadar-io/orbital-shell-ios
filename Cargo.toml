[package]
name = "orbital-shell-ios"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-shell-ios"
description = "Native iOS shell for the Orbital compiler (SwiftUI)."


# The orb versions this shell program runs under (its npm package records it as orbProgram.compiler).
[package.metadata.orb]
language = "^1"
[dependencies]
orbital-core-base = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
orbital-core-eval = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
orbital-canvas = { git = "https://github.com/almadar-io/orbital-canvas", branch = "main" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"

[dev-dependencies]
pretty_assertions = "1.4"
serde_json = "1.0"
orbital-ffi = { git = "https://github.com/almadar-io/orbital-ffi", branch = "main" }
